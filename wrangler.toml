name = "nexashare"
main = "src/entry.js"
compatibility_date = "2024-12-01"

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "nexashare-db"
database_id = "a282afe3-af5f-44e3-9982-c49dd5bd641d"

[triggers]
# Daily reports remain enabled at 06:00 UTC. The hourly trigger is gated in the
# Worker to Sunday 08:00 America/New_York, so daylight-saving changes are handled.
# "*/30" also checks for a new Chrome extension release and emails report@ once per version.
crons = ["0 6 * * *", "0 * * * *", "*/30 * * * *"]

[[routes]]
pattern = "nexashare.com"
custom_domain = true

[[routes]]
pattern = "www.nexashare.com"
custom_domain = true

[ai]
binding = "AI"

