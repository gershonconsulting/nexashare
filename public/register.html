<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register â NexaShare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;min-height:100vh;display:flex;flex-direction:column}
.nav{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#111}
.nav-logo{width:36px;height:36px;background:#0A66C2;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
.nav-brand span{font-size:20px;font-weight:700}
.nav-links a{color:#555;text-decoration:none;margin-left:24px;font-size:14px}
.container{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:48px;max-width:480px;width:100%}
.card h1{font-size:28px;margin-bottom:8px;color:#111}
.card p.sub{color:#666;margin-bottom:32px;font-size:15px;line-height:1.5}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:14px;font-weight:600;color:#333;margin-bottom:6px}
.form-group input{width:100%;padding:12px 16px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;outline:none;transition:border .2s}
.form-group input:focus{border-color:#0A66C2;box-shadow:0 0 0 3px rgba(10,102,194,.1)}
.btn-linkedin{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:#0A66C2;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:8px}
.btn-linkedin:hover{background:#004182}
.btn-linkedin svg{width:20px;height:20px;fill:#fff}
.divider{text-align:center;color:#999;font-size:13px;margin:24px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:#e5e7eb}
.divider::before{left:0}
.divider::after{right:0}
.login-link{text-align:center;margin-top:24px;font-size:14px;color:#666}
.login-link a{color:#0A66C2;text-decoration:none;font-weight:600}
.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px 16px;border-radius:8px;margin-bottom:20px;font-size:14px;display:none}
.team-badge{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;padding:8px 16px;border-radius:8px;margin-bottom:20px;font-size:14px}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-brand"><div class="nav-logo">N</div><span>NexaShare</span></a>
  <div class="nav-links"><a href="/login.html">Sign In</a></div>
</nav>
<div class="container">
  <div class="card">
    <h1>Create your team</h1>
    <p class="sub">Set up your company on NexaShare and start amplifying your LinkedIn presence in minutes.</p>
    <div class="error" id="error"></div>
    <div class="team-badge" id="teamBadge" style="display:none"></div>
    <form id="registerForm">
      <div class="form-group">
        <label>Company / Team name</label>
        <input type="text" id="teamName" placeholder="e.g. Acme Corp" required>
      </div>
      <button type="submit" class="btn-linkedin">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        Continue with LinkedIn
      </button>
    </form>
    <div class="login-link">Already have an account? <a href="/login.html">Sign in</a></div>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const teamParam = params.get('team');
if (teamParam) {
  document.getElementById('teamName').value = teamParam;
  document.getElementById('teamBadge').textContent = `You're joining team: ${teamParam}`;
  document.getElementById('teamBadge').style.display = 'block';
}
if (params.get('error')) {
  const el = document.getElementById('error');
  el.textContent = 'Registration failed. Please try again.';
  el.style.display = 'block';
}
document.getElementById('registerForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const team = document.getElementById('teamName').value.trim();
  if (!team) return;
  window.location.href = `/api/auth/linkedin?team=${encodeURIComponent(team)}`;
});
</script>
</body>
</html>
