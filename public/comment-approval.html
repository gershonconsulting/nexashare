<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexaShare — Comment approval</title><style>body{font:16px system-ui;background:#f6f8fc;color:#172033;margin:0;padding:24px}main{max-width:700px;margin:auto;background:white;border:1px solid #e1e7f0;border-radius:16px;padding:24px}blockquote{white-space:pre-wrap;background:#f3f6fa;padding:16px;border-radius:8px;margin:12px 0}textarea{width:100%;box-sizing:border-box;min-height:130px;padding:12px;font:inherit}button{padding:12px 22px;border:0;border-radius:8px;background:#0a66c2;color:white;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.5}a{color:#0a66c2}</style></head><body><main><h1>Review your AI comment</h1><p id="status">Loading approval…</p><section id="content" hidden><h2>Original post</h2><p id="source"></p><blockquote id="post"></blockquote><a id="link" rel="noopener noreferrer" target="_blank">View original on LinkedIn</a><h2>Suggested comment</h2><blockquote id="draft"></blockquote><label for="edited">Edit your comment</label><textarea id="edited" hidden></textarea><div id="actions"><button id="yes">YES — approve draft</button><button id="no">NO — reject</button><button id="edit">EDIT</button><button id="save" hidden>Approve edited comment</button></div></section><p id="result" role="status"></p></main><script>
const token=new URLSearchParams(location.search).get('token'),status=document.getElementById('status'),content=document.getElementById('content'),result=document.getElementById('result'),buttons=[...document.querySelectorAll('button')];
const setBusy=v=>buttons.forEach(b=>b.disabled=v);
async function send(action){setBusy(true);result.textContent='Saving decision…';try{const r=await fetch('/api/comment-approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action,comment:document.getElementById('edited').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not save');document.getElementById('actions').hidden=true;result.textContent=d.status==='rejected'?'Comment rejected.':'Comment approved. No comment has been published automatically. Open the original post to submit your approved comment on LinkedIn.';if(d.status==='approved'){const b=document.createElement('button');b.textContent='Copy approved comment';b.onclick=()=>navigator.clipboard.writeText(d.final_text);result.after(b)}}catch(e){result.textContent=e.message;setBusy(false)}}
document.getElementById('yes').onclick=()=>send('yes');document.getElementById('no').onclick=()=>send('no');document.getElementById('edit').onclick=()=>{document.getElementById('edited').hidden=false;document.getElementById('save').hidden=false;document.getElementById('yes').hidden=true;document.getElementById('edit').hidden=true};document.getElementById('save').onclick=()=>send('edit');
(async()=>{try{const r=await fetch('/api/comment-approval?token='+encodeURIComponent(token||''));const d=await r.json();if(!r.ok)throw Error(d.error);if(d.expired||d.status!=='emailed')throw Error('This request is expired or already decided.');status.textContent='Choose YES, NO, or EDIT. Nothing is published automatically.';content.hidden=false;document.getElementById('source').textContent=d.source_name;document.getElementById('post').textContent=d.original_post_text;document.getElementById('draft').textContent=d.draft_text;document.getElementById('edited').value=d.draft_text;document.getElementById('link').href=d.original_post_url}catch(e){status.textContent=e.message}})();
</script></body></html>
