name: Deploy NexaShare to Cloudflare

# Production deployment can be run manually. A push to main also deploys the
# current release so merged production changes are not left unpublished.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nexashare-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Worker and extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Worker smoke checks
        run: node tests/worker-smoke.mjs

      - name: Run admin daily report checks
        run: node tests/admin-report.test.mjs

      - name: Run weekly report checks
        run: node tests/weekly-report.test.mjs

      - name: Run daily report and growth integration checks
        run: |
          node tests/daily-report.test.mjs
          node tests/growth.test.mjs
          node tests/content-guards.mjs

      - name: Run proof-of-concept target checks
        run: node tests/access-policy.test.mjs

      - name: Run delivery engine checks
        run: node tests/delivery-engine.test.mjs

      - name: Validate JavaScript and Chrome manifest
        run: |
          node --check src/access-policy.js
          node --check src/index.js
          node --check src/worker.js
          node --check src/admin-report.js
          node --check src/weekly-report.js
          node --check src/reporting.js
          node --check src/referrals.js
          node --check src/intelligence.js
          node --check public/growth-dashboard.js
          node --check chrome-extension/sync-core.js
          node --check chrome-extension/content.js
          node --check chrome-extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('chrome-extension/manifest.json', 'utf8'))"

  deploy:
    name: Migrate D1 and deploy complete application
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build current private extension package
        run: |
          VERSION=$(node -p "require('./chrome-extension/manifest.json').version")
          echo "Packaging extension $VERSION"
          rm -f public/nexashare-extension-*.zip public/nexashare-extension.zip
          (cd chrome-extension && zip -r "../public/nexashare-extension-$VERSION.zip" .)
          cp "public/nexashare-extension-$VERSION.zip" public/nexashare-extension.zip

      - name: Publish extension download on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./chrome-extension/manifest.json').version")
          TAG="extension-v$VERSION"
          ASSET="public/nexashare-extension-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "NexaShare Chrome Extension v$VERSION" --notes "Private testing build of the NexaShare Chrome extension."
          fi
          gh release upload "$TAG" "$ASSET" --clobber

      - name: Apply D1 migrations and deploy Worker with assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.121.0"
          preCommands: wrangler d1 migrations apply nexashare-db --remote
          command: deploy
